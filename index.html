<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>moocha</title>
<link rel="icon" href="assets/logo-cow.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --cream:#FBF6EA; --cream2:#FFFDF8; --paper:#FFFFFF;
    --mint:#E3EEDC; --mint-deep:#A9C598;
    --brand:#85A573;
    --green:#4C8558; --green-dark:#2F5233;
    --blush:#FFDCD2; --blush-deep:#FF9E8B;
    --sun:#FFE29A; --sun-deep:#F2B705;
    --ink:#2F5233;
    --line: rgba(47,82,51,0.14);
    --shadow: 0 8px 22px rgba(47,82,51,0.12);
    --r-lg: 28px; --r-md:18px; --r-sm:12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{ background: var(--cream); color: var(--ink); font-family:'Nunito',sans-serif; min-height:100vh; display:flex; justify-content:center; }
  .heading{ font-family:'Baloo 2', sans-serif; }
  .app{ width:100%; max-width:460px; min-height:100vh; background:var(--cream); position:relative; display:flex; flex-direction:column; box-shadow:0 0 60px rgba(47,82,51,0.10); overflow-x:hidden;}
  .blob{ position:absolute; border-radius:44% 56% 62% 38% / 46% 40% 60% 54%; opacity:0.5; z-index:0; }

  header{ padding:22px 20px 8px 20px; display:flex; align-items:center; justify-content:space-between; position:relative; z-index:2;}
  .brand{ display:flex; align-items:center; gap:12px; }
  .header-logo{ height:44px; width:auto; display:block; margin-left:-2px;}
  @keyframes bob{ 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-3px) rotate(-3deg);} }
  .brand-name{ font-family:'Baloo 2'; font-weight:800; font-size:26px; color:var(--green-dark); line-height:1;}
  .brand-sub{ font-size:12px; color:var(--brand); font-weight:700; margin-top:2px;}
  .gear{ width:30px;height:30px; border-radius:50%; background:transparent; border:none; opacity:0.25; cursor:pointer; display:flex;align-items:center;justify-content:center;}
  .gear:active{ opacity:0.6; }

  nav{ display:flex; gap:8px; padding:10px 20px 14px 20px; overflow-x:auto; scrollbar-width:none; position:relative; z-index:2;}
  nav::-webkit-scrollbar{display:none;}
  .navbtn{ border:none; background:var(--paper); color:var(--green); padding:9px 18px; border-radius:999px; font-family:'Baloo 2'; font-weight:600; font-size:14px; cursor:pointer; white-space:nowrap; box-shadow:0 2px 0 var(--line);}
  .navbtn.active{ background:var(--green); color:#fff; box-shadow:0 3px 0 var(--green-dark);}

  main{ flex:1; padding:6px 20px 110px 20px; position:relative; z-index:2;}
  .section-label{ font-family:'Baloo 2'; font-size:21px; font-weight:700; margin:16px 0 2px 0; color:var(--green-dark);}
  .section-note{ font-size:13px; color:var(--brand); margin-bottom:10px; font-weight:600;}

  .item-card{ background:var(--paper); border-radius:var(--r-lg); padding:14px; display:flex; gap:14px; align-items:center; margin-bottom:12px; box-shadow:var(--shadow); cursor:pointer; border:2px solid transparent; transition: transform .12s ease;}
  .item-card:active{ transform: scale(0.97);}
  .item-thumb{ width:68px;height:68px;border-radius:20px; flex-shrink:0; display:flex;align-items:center;justify-content:center; overflow:hidden;}
  .item-thumb img{ width:100%; height:100%; object-fit:cover; display:block;}
  .item-info{ flex:1; min-width:0; }
  .item-name{ font-family:'Baloo 2'; font-weight:700; font-size:16.5px; margin-bottom:2px;}
  .item-desc{ font-size:12.5px; color:#6b8064; line-height:1.35; font-weight:600;}
  .item-price{ font-family:'Baloo 2'; font-weight:700; font-size:15px; color:var(--green); margin-top:6px;}
  .soldout-tag{ font-size:10.5px; font-weight:800; color:#b5563f; background:var(--blush); padding:3px 10px; border-radius:999px; display:inline-block; margin-top:6px;}
  .item-card.soldout{ opacity:0.5; cursor:default;}

  .coming-soon{ background:var(--paper); border:2.5px dashed var(--mint-deep); border-radius:var(--r-lg); padding:30px 18px; text-align:center; color:var(--brand); font-weight:700; margin-top:10px;}
  .coming-soon .heading{ font-size:19px; color:var(--green-dark); margin-bottom:4px;}
  .closed-banner{ background:var(--blush); border-radius:var(--r-lg); padding:22px 18px; text-align:center; margin-top:6px;}
  .closed-banner .heading{ font-size:18px; color:#b5563f; margin-bottom:4px;}
  .closed-banner div.sub{ font-size:13px; color:#8a5646; font-weight:600;}

  .tabbar{ position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:460px; background:var(--cream2); border-top:2px solid var(--mint); display:flex; justify-content:space-around; padding:10px 8px 16px 8px; z-index:30;}
  .tabitem{ display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; color:#a9bfa2; cursor:pointer; font-family:'Baloo 2'; font-size:11px; font-weight:700; padding:4px 12px; position:relative;}
  .tabitem.active{ color:var(--green-dark); transform: translateY(-2px);}
  .cart-badge{ position:absolute; top:-3px; right:4px; background:var(--sun-deep); color:#fff; font-size:9.5px; font-weight:800; width:16px;height:16px;border-radius:50%; display:flex;align-items:center;justify-content:center;}

  .overlay{ position:fixed; inset:0; background:rgba(47,82,51,0.45); display:none; align-items:flex-end; justify-content:center; z-index:100;}
  .overlay.show{ display:flex; }
  .overlay.center{ align-items:center; }
  .sheet{ background:var(--cream2); width:100%; max-width:460px; border-radius:32px 32px 0 0; max-height:88vh; overflow-y:auto; padding:20px 20px 30px 20px; animation: sheetup .22s ease;}
  .sheet.card-modal{ border-radius:28px; margin:0 20px; max-height:82vh;}
  @keyframes sheetup{ from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .sheet-close{ width:40px;height:6px;background:var(--mint-deep); border-radius:999px; margin:0 auto 14px auto;}
  .sheet-title{ font-family:'Baloo 2'; font-size:23px; font-weight:800; margin-bottom:2px; color:var(--green-dark);}
  .sheet-sub{ font-size:13px; color:var(--brand); font-weight:600; margin-bottom:16px;}

  .opt-group{ margin-bottom:18px;}
  .opt-label{ font-family:'Baloo 2'; font-weight:700; font-size:14px; display:flex; justify-content:space-between; margin-bottom:8px; color:var(--green-dark);}
  .opt-required{ font-size:9.5px; font-weight:800; color:var(--sun-deep); text-transform:uppercase; letter-spacing:0.04em;}
  .opt-row{ display:flex; flex-wrap:wrap; gap:8px;}
  .opt-chip{ border:2px solid var(--line); background:var(--paper); color:var(--green-dark); padding:8px 15px; border-radius:14px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:'Nunito';}
  .opt-chip.selected{ border-color:var(--green); background:var(--green); color:#fff;}
  .addon-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:2px dashed var(--line);}
  .addon-row:last-child{ border-bottom:none;}
  .addon-name{ font-size:13.5px; font-weight:700;}
  .addon-price{ font-size:12px; color:var(--brand); font-weight:700;}
  .addon-check{ width:24px;height:24px;border-radius:8px;border:2px solid var(--mint-deep); display:flex;align-items:center;justify-content:center; cursor:pointer; flex-shrink:0; font-weight:800;}
  .addon-check.checked{ background:var(--green); border-color:var(--green); color:#fff;}

  .qty-row{ display:flex; align-items:center; gap:16px; justify-content:center; margin:10px 0 18px 0;}
  .qty-btn{ width:38px;height:38px;border-radius:50%; border:none; background:var(--mint); color:var(--green-dark); font-size:19px; font-weight:800; cursor:pointer; box-shadow:0 3px 0 var(--mint-deep);}
  .qty-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--mint-deep);}
  .qty-num{ font-family:'Baloo 2'; font-size:19px; font-weight:800; min-width:20px; text-align:center; color:var(--green-dark);}

  .btn-primary{ width:100%; background:var(--green); color:#fff; border:none; padding:16px 20px; border-radius:18px; font-family:'Baloo 2'; font-weight:700; font-size:15px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; box-shadow:0 5px 0 var(--green-dark);}
  .btn-primary:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--green-dark);}
  .btn-primary:disabled{ background:#cdd8c9; box-shadow:0 5px 0 #b9c4b5; cursor:not-allowed;}
  .btn-secondary{ width:100%; background:transparent; color:var(--green); border:2px solid var(--mint-deep); padding:13px; border-radius:18px; font-weight:700; font-family:'Baloo 2'; font-size:14px; cursor:pointer; margin-top:8px;}

  .cart-line{ background:var(--paper); border-radius:20px; padding:14px; margin-bottom:10px; box-shadow:var(--shadow);}
  .cart-line-top{ display:flex; justify-content:space-between; font-family:'Baloo 2'; font-weight:700; font-size:15px;}
  .cart-line-opts{ font-size:12px; color:#7c9174; margin-top:4px; line-height:1.5; font-weight:600;}
  .cart-line-bottom{ display:flex; justify-content:space-between; align-items:center; margin-top:10px;}
  .mini-qty{ display:flex; align-items:center; gap:10px;}
  .mini-btn{ width:28px;height:28px;border-radius:9px;border:none; background:var(--mint); cursor:pointer; font-weight:800; color:var(--green-dark);}
  .remove-link{ font-size:11.5px; color:var(--blush-deep); font-weight:700; cursor:pointer;}

  .summary-row{ display:flex; justify-content:space-between; font-size:13.5px; padding:6px 0; color:#5b6e54; font-weight:700;}
  .summary-row.total{ font-family:'Baloo 2'; font-weight:800; font-size:17px; color:var(--green-dark); border-top:2px dashed var(--line); margin-top:6px; padding-top:12px;}

  .field{ margin-bottom:14px;}
  .field label{ font-size:12.5px; font-weight:800; color:var(--green-dark); display:block; margin-bottom:6px; font-family:'Baloo 2';}
  .field input, .field textarea{ width:100%; border:2px solid var(--line); background:var(--paper); border-radius:14px; padding:12px 14px; font-family:'Nunito'; font-weight:700; font-size:14px; color:var(--green-dark);}
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--green);}

  .empty-state{ text-align:center; padding:40px 20px; color:var(--brand);}
  .empty-state .heading{ font-size:19px; color:var(--green-dark); margin-bottom:6px;}

  .stamp-card{ background:linear-gradient(155deg, #E4F1DC, #C3E2B4); border-radius:28px; padding:22px; color:var(--green-dark); box-shadow:var(--shadow); position:relative; overflow:hidden; border:2px solid rgba(133,165,115,0.35);}
  .stamp-deco{ position:absolute; color:var(--brand); opacity:0.3; pointer-events:none; z-index:0;}
  .stamp-card-inner{ position:relative; z-index:1;}
  .stamp-card-logo{ position:absolute; top:-16px; right:-18px; width:100px; opacity:0.16; pointer-events:none; z-index:0;}
  .stamp-card-title{ font-family:'Baloo 2'; font-size:19px; font-weight:800;}
  .stamp-card-goal{ font-size:12px; opacity:0.75; margin-top:2px; font-weight:700;}
  .stamp-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:9px; margin-top:16px; position:relative; z-index:1;}
  .stamp-slot{ aspect-ratio:1; border-radius:50%; background:rgba(255,255,255,0.5); border:2px dashed rgba(76,133,88,0.4); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .stamp-slot.filled{ background:var(--sun); border-style:solid; border-color:var(--sun); animation: pop .3s ease;}
  .stamp-slot img{ width:78%; height:78%; object-fit:contain;}
  @keyframes pop{ 0%{transform:scale(0.4);} 70%{transform:scale(1.15);} 100%{transform:scale(1);} }
  .reward-banner{ margin-top:16px; background:var(--sun); color:#6b4c05; font-weight:800; font-family:'Baloo 2'; font-size:13px; padding:11px 14px; border-radius:14px; text-align:center; position:relative; z-index:1;}
  .order-row{ background:var(--paper); border-radius:18px; padding:13px 14px; margin-bottom:9px; display:flex; justify-content:space-between; align-items:center; box-shadow:var(--shadow);}
  .order-row-left .oid{ font-size:11px; color:var(--brand); font-weight:700;}
  .order-row-left .oitems{ font-size:13px; font-weight:800; margin-top:2px; font-family:'Baloo 2';}
  .order-row-right{ text-align:right;}
  .order-row-right .oprice{ font-family:'Baloo 2'; font-weight:800; font-size:14px; color:var(--green-dark);}
  .order-status{ font-size:9.5px; font-weight:800; padding:2px 9px; border-radius:999px; background:var(--mint); color:var(--green-dark); text-transform:uppercase; margin-top:4px; display:inline-block;}

  .qr-box{ background:#fff; padding:18px; border-radius:20px; display:flex; justify-content:center; margin:6px 0 14px 0; box-shadow: var(--shadow);}
  .pay-amount{ text-align:center; font-family:'Baloo 2'; font-size:30px; font-weight:800; color:var(--green-dark); margin-bottom:2px;}
  .pay-to{ text-align:center; font-size:12.5px; color:var(--brand); font-weight:700; margin-bottom:16px;}

  .toast{ position:fixed; bottom:104px; left:50%; transform:translateX(-50%); background:var(--green-dark); color:#fff; padding:12px 22px; border-radius:999px; font-size:13px; font-weight:700; font-family:'Baloo 2'; z-index:200; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition: opacity .2s ease, transform .2s ease;}
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-8px);}
  .confetti-piece{ position:fixed; top:-10px; border-radius:3px; z-index:250; pointer-events:none; }

  #adminApp{ display:none; width:100%; max-width:520px; min-height:100vh; background:var(--cream); flex-direction:column; }
  .admin-header{ background:var(--green-dark); color:#fff; padding:20px; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .admin-header .heading{ font-size:20px; font-weight:800;}
  .admin-header-btns{ display:flex; gap:8px; }
  .admin-back{ background:rgba(255,255,255,0.15); border:none; color:#fff; padding:8px 14px; border-radius:999px; font-weight:700; font-size:12px; cursor:pointer; font-family:'Baloo 2';}
  .admin-tabs{ display:flex; background:var(--cream2); border-bottom:2px solid var(--mint); overflow-x:auto;}
  .admin-tab{ flex:1; padding:13px 10px; text-align:center; background:none; border:none; font-family:'Baloo 2'; font-weight:700; font-size:12.5px; color:#93a88d; cursor:pointer; white-space:nowrap; border-bottom:3px solid transparent;}
  .admin-tab.active{ color:var(--green-dark); border-bottom-color:var(--green);}
  .admin-main{ padding:18px 20px 60px 20px; flex:1;}
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px;}
  .stat-card{ background:var(--paper); border-radius:18px; padding:14px; box-shadow:var(--shadow);}
  .stat-num{ font-family:'Baloo 2'; font-size:22px; font-weight:800; color:var(--green-dark);}
  .stat-label{ font-size:11.5px; color:var(--brand); font-weight:700; margin-top:2px;}
  .chart-card{ background:var(--paper); border-radius:18px; padding:16px; box-shadow:var(--shadow); margin-bottom:18px;}
  .top-item-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; font-weight:700;}
  .top-item-row:last-child{ border-bottom:none;}
  .table-row{ background:var(--paper); border-radius:16px; padding:12px 14px; margin-bottom:9px; box-shadow:var(--shadow); display:flex; justify-content:space-between; align-items:center;}
  .table-row .name{ font-weight:800; font-family:'Baloo 2'; font-size:14px;}
  .table-row .sub{ font-size:11.5px; color:var(--brand); font-weight:600; margin-top:2px;}
  .table-row .right{ text-align:right; font-size:12.5px; font-weight:700; color:var(--green-dark);}
  .admin-item-row{ background:var(--paper); border-radius:16px; padding:12px 14px; margin-bottom:9px; box-shadow:var(--shadow);}
  .admin-item-top{ display:flex; justify-content:space-between; align-items:center;}
  .admin-item-name{ font-weight:800; font-family:'Baloo 2';}
  .admin-item-actions{ display:flex; gap:8px;}
  .icon-btn{ background:var(--mint); border:none; border-radius:9px; width:30px;height:30px; cursor:pointer; font-weight:800; color:var(--green-dark);}
  .icon-btn.danger{ background:var(--blush); color:#b5563f;}
  .toggle{ position:relative; width:46px;height:26px; border-radius:999px; background:#d7ddd3; cursor:pointer; flex-shrink:0;}
  .toggle.on{ background:var(--green);}
  .toggle .knob{ position:absolute; top:3px; left:3px; width:20px;height:20px; border-radius:50%; background:#fff; transition: left .15s ease;}
  .toggle.on .knob{ left:23px;}
  .settings-row{ display:flex; justify-content:space-between; align-items:center; background:var(--paper); border-radius:16px; padding:14px 16px; margin-bottom:12px; box-shadow:var(--shadow);}
  .pin-dots{ display:flex; gap:12px; justify-content:center; margin:18px 0;}
  .pin-dot{ width:16px;height:16px;border-radius:50%; border:2px solid var(--green); }
  .pin-dot.filled{ background:var(--green);}
  .keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:260px; margin:0 auto;}
  .key{ background:var(--paper); border:none; border-radius:16px; padding:16px; font-family:'Baloo 2'; font-weight:800; font-size:18px; color:var(--green-dark); box-shadow:0 3px 0 var(--line); cursor:pointer;}
  .demo-banner{ background:var(--sun); color:#6b4c05; font-size:11.5px; font-weight:700; padding:10px 14px; border-radius:14px; margin-bottom:14px; text-align:center;}
</style>
</head>
<body>

<!-- ============= CUSTOMER APP ============= -->
<div class="app" id="app">
  <div class="blob" style="width:180px;height:180px; background:var(--mint); top:-60px; right:-60px;"></div>
  <div class="blob" style="width:120px;height:120px; background:var(--blush); top:120px; left:-50px; opacity:0.35;"></div>

  <header>
    <div class="brand">
      <img src="assets/logo-full.png" alt="moocha" class="header-logo">
      <div>
        <div class="brand-sub">matcha & friends 🐮</div>
      </div>
    </div>
    <button class="gear" onclick="openPinModal()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="#2F5233" stroke-width="1.8"/><path d="M19.4 13a7.4 7.4 0 0 0 0-2l2-1.5-2-3.4-2.3.9a7.6 7.6 0 0 0-1.7-1L15 3.6h-4l-.4 2.4a7.6 7.6 0 0 0-1.7 1l-2.3-.9-2 3.4L6.6 11a7.4 7.4 0 0 0 0 2l-2 1.5 2 3.4 2.3-.9c.5.4 1.1.75 1.7 1l.4 2.4h4l.4-2.4c.6-.25 1.2-.6 1.7-1l2.3.9 2-3.4-2-1.5z" stroke="#2F5233" stroke-width="1.4" fill="none"/></svg>
    </button>
  </header>

  <nav id="catNav"></nav>
  <main id="mainView"></main>

  <div class="tabbar">
    <button class="tabitem" data-tab="menu" onclick="setTab('menu')">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      Menu
    </button>
    <button class="tabitem" data-tab="loyalty" onclick="setTab('loyalty')">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.35-9.5-8.5C.8 8.6 3 5 6.5 5c2 0 3.4 1.1 4 2.2C11.1 6.1 12.5 5 14.5 5 18 5 20.2 8.6 18.5 12.5 16 16.65 12 21 12 21z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
      Rewards
    </button>
    <button class="tabitem" data-tab="cart" onclick="setTab('cart')" style="position:relative;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M3 4h2l2.4 12.4a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L21 8H6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/></svg>
      Cart
      <span class="cart-badge" id="cartBadge" style="display:none;">0</span>
    </button>
  </div>
</div>

<!-- ============= ADMIN APP ============= -->
<div class="app" id="adminApp">
  <div class="admin-header">
    <div class="heading">🐮 moocha staff</div>
    <div class="admin-header-btns">
      <button class="admin-back" onclick="refreshAdminData().then(()=>setATab(state.adminTab))">↻ Refresh</button>
      <button class="admin-back" onclick="exitAdmin()">Back to app</button>
    </div>
  </div>
  <div class="admin-tabs">
    <button class="admin-tab" data-atab="sales" onclick="setATab('sales')">Sales</button>
    <button class="admin-tab" data-atab="orders" onclick="setATab('orders')">Orders</button>
    <button class="admin-tab" data-atab="customers" onclick="setATab('customers')">Customers</button>
    <button class="admin-tab" data-atab="menu" onclick="setATab('menu')">Menu</button>
    <button class="admin-tab" data-atab="settings" onclick="setATab('settings')">Settings</button>
  </div>
  <div class="admin-main" id="adminMain"></div>
</div>

<div class="overlay" id="itemOverlay" onclick="if(event.target===this) closeItemSheet()"><div class="sheet" id="itemSheet"></div></div>
<div class="overlay" id="checkoutOverlay" onclick="if(event.target===this) closeCheckout()"><div class="sheet" id="checkoutSheet"></div></div>
<div class="overlay center" id="pinOverlay" onclick="if(event.target===this) closePinModal()"><div class="sheet card-modal" id="pinSheet"></div></div>
<div class="overlay" id="editorOverlay" onclick="if(event.target===this) closeEditor()"><div class="sheet" id="editorSheet"></div></div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   MOOCHA — customer app + hidden staff view, backed by Supabase
   so orders/menu/settings are real and shared across every phone.

   SETUP (see README.md for full steps):
   1. Create a free project at https://supabase.com
   2. Run supabase-schema.sql (included) in the SQL editor
   3. Paste your Project URL + anon public key below
   4. Deploy this whole folder to Netlify
   ============================================================ */
const SUPABASE_URL = "PASTE_YOUR_SUPABASE_URL_HERE";
const SUPABASE_ANON_KEY = "PASTE_YOUR_SUPABASE_ANON_KEY_HERE";

let sb = null;
if(SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 20){
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

const STAMP_GOAL = 12;
const DEFAULT_SETTINGS = { paymentEnabled: true, stallPhone: "+6596586775", stallName: "Moocha" };
const DEMO_PASSPHRASE_KEY = "moocha_demo_passphrase"; // only used when Supabase isn't connected yet
const DEFAULT_MENU = {
  categories: {
    "Matcha Drinks": [
      { id:"m1", name:"Matcha Latte", desc:"Our everyday matcha, whisked with fresh milk.", price:6.00, iced:true, soldout:false, icon:"matcha",
        milks:[{id:"milk1",name:"Fresh milk",price:0},{id:"milk2",name:"Oat milk",price:0.80},{id:"milk3",name:"Soy milk",price:0.60}],
        toppings:[{id:"top1",name:"Extra matcha shot",price:1.50},{id:"top2",name:"Pearls",price:0.80}] },
      { id:"m2", name:"Strawberry Matcha", desc:"Layered strawberry puree with ceremonial matcha.", price:7.00, iced:true, soldout:false, icon:"strawberry",
        milks:[{id:"milk1",name:"Fresh milk",price:0},{id:"milk2",name:"Oat milk",price:0.80}],
        toppings:[{id:"top1",name:"Extra matcha shot",price:1.50},{id:"top2",name:"Pearls",price:0.80},{id:"top3",name:"Grass jelly",price:0.80}] },
      { id:"m3", name:"Sea Salt Foam Matcha", desc:"Matcha topped with a whisked sea salt cream foam.", price:7.00, iced:true, soldout:false, photo:"assets/sea-salt-matcha.jpg",
        milks:[{id:"milk1",name:"Fresh milk",price:0},{id:"milk3",name:"Soy milk",price:0.60}],
        toppings:[{id:"top1",name:"Extra matcha shot",price:1.50}] },
      { id:"m4", name:"Biscoff Matcha", desc:"Matcha and biscoff caramel, swirled together.", price:7.50, iced:true, soldout:false, photo:"assets/biscoff-matcha.jpg",
        milks:[{id:"milk1",name:"Fresh milk",price:0},{id:"milk2",name:"Oat milk",price:0.80}],
        toppings:[] }
    ],
    "Seasonal Bakes": []
  }
};
const MODIFIERS = {
  ice: { label:"Ice level", options:["No ice","Less ice","Normal ice","More ice"] },
  size: { label:"Size", options:[ {name:"Regular",price:0}, {name:"Large",price:1.00} ]}
};
const DEFAULT_SUGAR_LEVELS = ["0%","25%","50%","75%","100%"];

/* ---------------- local (device-only) helpers ---------------- */
function getLocal(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function setLocal(key, value){ try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){} }

/* ---------------- state ---------------- */
let state = {
  tab:"menu", activeCat:null,
  cart: getLocal("moocha_cart", []),
  myProfile: getLocal("moocha_my_profile", null),
  myStamps: 0,
  menu: DEFAULT_MENU, settings: DEFAULT_SETTINGS, orders: [], customers: [],
  currentItem:null, currentSel:{}, isAdmin:false, adminTab:"sales", editingItem:null, editingCustomer:null,
  lastSupabaseError: null
};

/* Every write/read that talks to Supabase records the first error it hits
   here, in plain English, so a real problem shows up as a visible banner
   in the staff dashboard instead of silently doing nothing. */
function noteSupabaseError(label, error){
  console.error(label, error);
  state.lastSupabaseError = `${label}: ${error.message || JSON.stringify(error)}`;
}

/* ---------------- supabase-backed shared data ---------------- */
async function fetchOrders(){
  if(!sb) return getLocal("demo_orders", []);
  const { data, error } = await sb.from('orders').select('*').order('date',{ascending:false});
  if(error){ noteSupabaseError("Loading orders", error); return []; }
  return data.map(r=>({ id:r.id, name:r.name, phone:r.phone, date:r.date, items:r.items, total:Number(r.total), notes:r.notes, status:r.status }));
}
async function fetchSettings(){
  if(!sb) return getLocal("demo_settings", DEFAULT_SETTINGS);
  const { data, error } = await sb.from('settings').select('*').eq('id','main').single();
  if(error){ noteSupabaseError("Loading settings", error); return DEFAULT_SETTINGS; }
  if(!data) return DEFAULT_SETTINGS;
  return { paymentEnabled: data.payment_enabled, stallPhone: data.stall_phone, stallName: data.stall_name };
}
/* Staff passphrase check — the real passphrase is never sent to the browser.
   With Supabase connected, this calls a database function that compares it
   server-side and only returns true/false. Without Supabase (demo mode),
   it falls back to a passphrase saved on this device only. */
async function checkStaffPassphrase(candidate){
  if(!sb){ return candidate === getLocal(DEMO_PASSPHRASE_KEY, "QUEENraks!"); }
  const { data, error } = await sb.rpc('check_staff_pin', { candidate });
  if(error){ noteSupabaseError("Checking passphrase", error); return false; }
  return data === true;
}
async function changeStaffPassphrase(oldPass, newPass){
  if(!sb){
    if(oldPass !== getLocal(DEMO_PASSPHRASE_KEY, "QUEENraks!")) return false;
    setLocal(DEMO_PASSPHRASE_KEY, newPass); return true;
  }
  const { data, error } = await sb.rpc('set_staff_pin', { old_pin: oldPass, new_pin: newPass });
  if(error){ noteSupabaseError("Changing passphrase", error); return false; }
  return data === true;
}
async function fetchMenu(){
  if(!sb) return getLocal("demo_menu", DEFAULT_MENU);
  const { data, error } = await sb.from('menu').select('*').eq('id','main').single();
  if(error){ noteSupabaseError("Loading menu", error); return DEFAULT_MENU; }
  if(!data) return DEFAULT_MENU;
  return data.data;
}
async function persistMenu(){
  if(!sb){ setLocal("demo_menu", state.menu); setATab("menu"); return; }
  const { error } = await sb.from('menu').update({ data: state.menu }).eq('id','main');
  if(error) noteSupabaseError("Saving menu", error);
  setATab("menu");
}
async function persistSettings(){
  if(!sb){ setLocal("demo_settings", state.settings); return; }
  const { error } = await sb.from('settings').update({
    payment_enabled: state.settings.paymentEnabled,
    stall_phone: state.settings.stallPhone, stall_name: state.settings.stallName
  }).eq('id','main');
  if(error) noteSupabaseError("Saving settings", error);
}
async function insertOrder(order){
  if(!sb){ const list = getLocal("demo_orders", []); list.unshift(order); setLocal("demo_orders", list); state.orders = list; return; }
  const { error } = await sb.from('orders').insert({ id:order.id, name:order.name, phone:order.phone, date:order.date, items:order.items, total:order.total, notes:order.notes, status:order.status });
  if(error){ noteSupabaseError("Saving your order", error); showToast("Couldn't save your order — please tell staff"); }
  state.orders = await fetchOrders();
}
async function deleteOrder(id){
  if(!sb){ let list = getLocal("demo_orders", []); list = list.filter(o=>o.id!==id); setLocal("demo_orders", list); state.orders = list; return; }
  const { error } = await sb.from('orders').delete().eq('id', id);
  if(error) noteSupabaseError("Deleting order", error);
  state.orders = await fetchOrders();
}

/* ---------------- customers & loyalty stamps (a real stored number,
   not calculated from order count, so staff can edit it directly) ---------------- */
async function fetchCustomers(){
  if(!sb) return getLocal("demo_customers", []);
  const { data, error } = await sb.from('customers').select('*');
  if(error){ noteSupabaseError("Loading customers", error); return []; }
  return data;
}
async function bumpCustomerStamp(phone, name){
  if(!sb){
    const list = getLocal("demo_customers", []);
    const c = list.find(x=>x.phone===phone);
    if(c){ c.stamps = (c.stamps||0) + 1; c.name = name; } else { list.push({ phone, name, stamps: 1 }); }
    setLocal("demo_customers", list);
    return;
  }
  const { data: existing, error: selError } = await sb.from('customers').select('*').eq('phone', phone).maybeSingle();
  if(selError){ noteSupabaseError("Checking your stamp card", selError); return; }
  if(existing){
    const { error } = await sb.from('customers').update({ stamps: (existing.stamps||0)+1, name, updated_at: new Date().toISOString() }).eq('phone', phone);
    if(error) noteSupabaseError("Updating your stamp card", error);
  } else {
    const { error } = await sb.from('customers').insert({ phone, name, stamps: 1 });
    if(error) noteSupabaseError("Starting your stamp card", error);
  }
}
async function setCustomerStamps(phone, stamps){
  if(!sb){ const list = getLocal("demo_customers", []); const c = list.find(x=>x.phone===phone); if(c) c.stamps = stamps; setLocal("demo_customers", list); return; }
  const { error } = await sb.from('customers').update({ stamps, updated_at: new Date().toISOString() }).eq('phone', phone);
  if(error) noteSupabaseError("Saving stamp count", error);
}
async function deleteCustomerRecord(phone){
  if(!sb){ let list = getLocal("demo_customers", []); list = list.filter(c=>c.phone!==phone); setLocal("demo_customers", list); return; }
  const { error } = await sb.from('customers').delete().eq('phone', phone);
  if(error) noteSupabaseError("Deleting customer", error);
}
async function refreshMyLoyalty(){
  if(!state.myProfile){ state.myStamps = 0; return; }
  const list = await fetchCustomers();
  const mine = list.find(c=>c.phone===state.myProfile.phone);
  state.myStamps = mine ? (mine.stamps||0) : 0;
}
async function loadShared(){
  state.settings = await fetchSettings();
  state.menu = await fetchMenu();
  state.orders = await fetchOrders();
  if(!state.activeCat) state.activeCat = Object.keys(state.menu.categories)[0];
  await refreshMyLoyalty();
}

function saveCartLocal(){ setLocal("moocha_cart", state.cart); }
function money(n){ return "$" + n.toFixed(2); }
function showToast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1700); }

/* ---------------- tabs ---------------- */
function setTab(tab){
  state.tab = tab;
  document.querySelectorAll(".tabitem").forEach(b=>b.classList.toggle("active", b.dataset.tab===tab));
  document.getElementById("catNav").style.display = tab==="menu" ? "flex" : "none";
  if(tab==="loyalty"){ refreshMyLoyalty().then(render); return; }
  render();
}

/* hand-drawn doodle icons matching the logo's line style, for items without a photo */
function doodleIcon(type){
  if(type==="strawberry"){
    return `<svg viewBox="0 0 64 64" width="34" height="34" fill="none">
      <path d="M20 26h24l-2.5 24a4 4 0 0 1-4 3.6H26.5a4 4 0 0 1-4-3.6L20 26z" stroke="#85A573" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M20 26c0-2.2 2.7-4 12-4s12 1.8 12 4" stroke="#85A573" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M23 33q9 6 18 0" stroke="#E8877A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M27 21c-1-3 1-5 4-5M37 21c1-3-1-5-4-5" stroke="#7FAE63" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>`;
  }
  return `<svg viewBox="0 0 64 64" width="34" height="34" fill="none">
    <path d="M20 26h24l-2.5 24a4 4 0 0 1-4 3.6H26.5a4 4 0 0 1-4-3.6L20 26z" stroke="#85A573" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M20 26c0-2.2 2.7-4 12-4s12 1.8 12 4" stroke="#85A573" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M23 32q9 5 18 0" stroke="#85A573" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M32 15c2-4 6-5 9-3" stroke="#85A573" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </svg>`;
}
function itemThumbHTML(item){
  if(item.photo) return `<div class="item-thumb"><img src="${item.photo}" alt="${item.name}"></div>`;
  return `<div class="item-thumb" style="background:linear-gradient(155deg,#EEF4E9,#D3E2C6);">${doodleIcon(item.icon)}</div>`;
}

/* ---------------- render router ---------------- */
function render(){
  const main = document.getElementById("mainView");
  if(state.tab==="menu") main.innerHTML = renderMenu();
  else if(state.tab==="cart") main.innerHTML = renderCart();
  else main.innerHTML = renderLoyalty();
  renderCatNav();
  renderCartBadge();
}
function renderCatNav(){
  const nav = document.getElementById("catNav");
  nav.style.display = state.tab==="menu" ? "flex" : "none";
  nav.innerHTML = Object.keys(state.menu.categories).map(cat =>
    `<button class="navbtn ${cat===state.activeCat?'active':''}" onclick="state.activeCat='${cat}'; render();">${cat}</button>`
  ).join("");
}
function renderCartBadge(){
  const count = state.cart.reduce((s,i)=>s+i.qty,0);
  const badge = document.getElementById("cartBadge");
  if(count>0){ badge.style.display="flex"; badge.textContent=count; } else badge.style.display="none";
}

/* ---------------- menu view ---------------- */
function renderMenu(){
  const closedNotice = !state.settings.paymentEnabled ? `<div class="closed-banner" style="padding:14px 16px; margin-bottom:14px;"><div class="heading" style="font-size:15px;">taking a little break 💚</div><div class="sub">browse away — we'll open up checkout again soon!</div></div>` : "";
  const items = state.menu.categories[state.activeCat] || [];
  if(items.length===0){
    return closedNotice + `<div class="coming-soon"><div class="heading">nothing here yet 🍃</div>more treats coming soon — check back!</div>`;
  }
  return closedNotice + items.map(item => `
    <div class="item-card ${item.soldout?'soldout':''}" onclick="${item.soldout?'':`openItem('${item.id}')`}">
      ${itemThumbHTML(item)}
      <div class="item-info">
        <div class="item-name">${item.name}</div>
        <div class="item-desc">${item.desc}</div>
        <div class="item-price">${money(item.price)}</div>
        ${item.soldout?'<div class="soldout-tag">sold out today</div>':''}
      </div>
    </div>
  `).join("");
}

/* ---------------- item options sheet ---------------- */
function findItem(id){ for(const cat in state.menu.categories){ const f = state.menu.categories[cat].find(i=>i.id===id); if(f) return f; } }
/* An item allows a pool option if its id is in the item's own list. Older
   items saved before per-drink selection existed have no list yet — treat
   that as "allows everything currently in the pool" so nothing breaks. */
function openItem(id){
  const item = findItem(id);
  state.currentItem = item;
  const milks = item.milks || [];
  const sugarLevels = (item.sugarLevels && item.sugarLevels.length) ? item.sugarLevels : DEFAULT_SUGAR_LEVELS;
  state.currentSel = { ice: item.iced ? "Normal ice" : null, sugar: sugarLevels.includes("50%") ? "50%" : sugarLevels[0], milk: milks[0]?milks[0].name:null, size:"Regular", addons:[], qty:1 };
  document.getElementById("itemSheet").innerHTML = itemSheetHTML();
  document.getElementById("itemOverlay").classList.add("show");
}
function closeItemSheet(){ document.getElementById("itemOverlay").classList.remove("show"); }
function itemSheetHTML(){
  const item = state.currentItem, sel = state.currentSel;
  const modRow = (key) => {
    const mod = MODIFIERS[key];
    if(key==="ice" && !item.iced) return "";
    const opts = mod.options.map(o=>{
      const name = typeof o === "string" ? o : o.name;
      const price = typeof o === "string" ? null : o.price;
      const active = sel[key]===name;
      return `<button class="opt-chip ${active?'selected':''}" onclick="selectOpt('${key}','${name}')">${name}${price?` +${price.toFixed(2)}`:''}</button>`;
    }).join("");
    return `<div class="opt-group"><div class="opt-label">${mod.label} <span class="opt-required">pick one</span></div><div class="opt-row">${opts}</div></div>`;
  };
  const sugarLevels = (item.sugarLevels && item.sugarLevels.length) ? item.sugarLevels : DEFAULT_SUGAR_LEVELS;
  const sugarRow = sugarLevels.length ? `<div class="opt-group"><div class="opt-label">Sweetness <span class="opt-required">pick one</span></div><div class="opt-row">${
    sugarLevels.map(name=>`<button class="opt-chip ${sel.sugar===name?'selected':''}" onclick="selectOpt('sugar','${name}')">${name}</button>`).join("")
  }</div></div>` : "";
  const milks = item.milks || [];
  const milkRow = milks.length ? `<div class="opt-group"><div class="opt-label">Milk <span class="opt-required">pick one</span></div><div class="opt-row">${
    milks.map(o=>`<button class="opt-chip ${sel.milk===o.name?'selected':''}" onclick="selectOpt('milk','${o.name}')">${o.name}${o.price?` +${o.price.toFixed(2)}`:''}</button>`).join("")
  }</div></div>` : "";
  const toppings = item.toppings || [];
  const addonRows = toppings.map(a=>{
    const checked = sel.addons.includes(a.name);
    return `<div class="addon-row"><div><div class="addon-name">${a.name}</div><div class="addon-price">+${money(a.price)}</div></div><div class="addon-check ${checked?'checked':''}" onclick="toggleAddon('${a.name}')">${checked?'✓':''}</div></div>`;
  }).join("");
  return `
    <div class="sheet-close"></div>
    <div class="sheet-title">${item.name}</div>
    <div class="sheet-sub">${item.desc}</div>
    ${modRow("ice")}${sugarRow}${milkRow}${modRow("size")}
    ${toppings.length ? `<div class="opt-group"><div class="opt-label">Add-ons</div>${addonRows}</div>` : ""}
    <div class="qty-row"><button class="qty-btn" onclick="changeQty(-1)">−</button><div class="qty-num">${sel.qty}</div><button class="qty-btn" onclick="changeQty(1)">+</button></div>
    <button class="btn-primary" onclick="addToCart()"><span>Add to cart</span><span>${money(itemLineTotal())}</span></button>
  `;
}
function selectOpt(key,name){ state.currentSel[key]=name; document.getElementById("itemSheet").innerHTML = itemSheetHTML(); }
function toggleAddon(name){ const a=state.currentSel.addons; const i=a.indexOf(name); if(i>-1) a.splice(i,1); else a.push(name); document.getElementById("itemSheet").innerHTML = itemSheetHTML(); }
function changeQty(d){ state.currentSel.qty = Math.max(1, state.currentSel.qty+d); document.getElementById("itemSheet").innerHTML = itemSheetHTML(); }
function itemLineTotal(){
  const item=state.currentItem, sel=state.currentSel; let unit=item.price;
  const milkOpt = (item.milks||[]).find(o=>o.name===sel.milk); if(milkOpt) unit+=milkOpt.price;
  const sizeOpt = MODIFIERS.size.options.find(o=>o.name===sel.size); if(sizeOpt) unit+=sizeOpt.price;
  sel.addons.forEach(name=>{ const a=(item.toppings||[]).find(x=>x.name===name); if(a) unit+=a.price; });
  return unit*sel.qty;
}
function addToCart(){
  const item=state.currentItem, sel=state.currentSel;
  state.cart.push({ lineId: Date.now()+Math.random(), itemId:item.id, name:item.name, ice:sel.ice, sugar:sel.sugar, milk:sel.milk, size:sel.size, addons:[...sel.addons], qty:sel.qty, lineTotal:itemLineTotal() });
  saveCartLocal(); closeItemSheet(); renderCartBadge(); showToast(`Added ${item.name} 🍵`);
}

/* ---------------- cart view ---------------- */
function cartSubtotal(){ return state.cart.reduce((s,l)=>s+l.lineTotal,0); }
function renderCart(){
  if(state.cart.length===0){
    return `<div class="empty-state"><div class="heading">cart's empty!</div>add a drink from the menu to get started 🌿</div>`;
  }
  const lines = state.cart.map(l=>{
    const opts = [l.ice,l.sugar,l.milk,l.size,...l.addons].filter(Boolean).join(" · ");
    return `<div class="cart-line">
      <div class="cart-line-top"><span>${l.name}</span><span>${money(l.lineTotal)}</span></div>
      <div class="cart-line-opts">${opts}</div>
      <div class="cart-line-bottom">
        <div class="mini-qty"><button class="mini-btn" onclick="cartQty('${l.lineId}',-1)">−</button><span>${l.qty}</span><button class="mini-btn" onclick="cartQty('${l.lineId}',1)">+</button></div>
        <span class="remove-link" onclick="removeLine('${l.lineId}')">Remove</span>
      </div>
    </div>`;
  }).join("");
  const subtotal = cartSubtotal();
  const disabled = !state.settings.paymentEnabled;
  return `${lines}
    <div style="margin-top:16px;"><div class="summary-row total"><span>Total</span><span>${money(subtotal)}</span></div></div>
    <button class="btn-primary" style="margin-top:16px;" ${disabled?'disabled':''} onclick="openCheckout()"><span>${disabled?"Orders paused":"Checkout"}</span><span>${money(subtotal)}</span></button>
  `;
}
function cartQty(lineId,d){ const l=state.cart.find(x=>x.lineId==lineId); if(!l) return; const unit=l.lineTotal/l.qty; l.qty=Math.max(1,l.qty+d); l.lineTotal=unit*l.qty; saveCartLocal(); render(); }
function removeLine(lineId){ state.cart = state.cart.filter(x=>x.lineId!=lineId); saveCartLocal(); render(); }

/* ---------------- checkout via Stripe (card + PayNow, one flow) ---------------- */
function openCheckout(){ document.getElementById("checkoutSheet").innerHTML = checkoutHTML(); document.getElementById("checkoutOverlay").classList.add("show"); }
function closeCheckout(){ document.getElementById("checkoutOverlay").classList.remove("show"); }
function checkoutHTML(){
  const p = state.myProfile || { name:"", phone:"" };
  const noBackend = !sb ? `<div class="demo-banner" style="margin-bottom:14px;">Connect Supabase first (see README.md, Parts 1–2) for this to save for real.</div>` : "";
  return `
    <div class="sheet-close"></div>
    <div class="sheet-title">Checkout 🧋</div>
    <div class="sheet-sub">We'll use this for your order and your stamp card.</div>
    ${noBackend}
    <div class="field"><label>Name</label><input id="ckName" value="${p.name||''}" placeholder="Your name"></div>
    <div class="field"><label>Phone number</label><input id="ckPhone" value="${p.phone||''}" placeholder="9XXX XXXX" inputmode="tel"></div>
    <div class="field"><label>Notes (optional)</label><textarea id="ckNotes" rows="2" placeholder="e.g. allergies, pickup time"></textarea></div>
    <div class="summary-row total" style="margin-bottom:14px;"><span>Total</span><span>${money(cartSubtotal())}</span></div>
    <button class="btn-primary" onclick="confirmManualOrder()"><span>Place order</span><span>${money(cartSubtotal())}</span></button>
    <div class="section-note" style="text-align:center; margin-top:10px;">Pay ${state.settings.stallName} via PayNow to ${state.settings.stallPhone}, then tap above once you've paid.</div>
    ${sb ? `<div class="remove-link" style="text-align:center; margin-top:14px;" onclick="startStripeCheckout()">Pay by card instead</div>` : ""}
  `;
}
/* Default checkout path: no payment processor required, just a manual
   PayNow transfer confirmed by the customer. Good enough for a small
   stall; set up Stripe (README Part 5) later for real-time confirmation
   instead of the honor system this relies on. */
async function confirmManualOrder(){
  const name = document.getElementById("ckName").value.trim();
  const phone = document.getElementById("ckPhone").value.trim();
  if(!name || !phone){ showToast("Fill in your name and phone number 🙏"); return; }
  const notes = document.getElementById("ckNotes").value.trim();
  state.myProfile = { name, phone }; setLocal("moocha_my_profile", state.myProfile);

  const order = {
    id: "M" + Date.now().toString().slice(-6),
    name, phone, date: new Date().toISOString(),
    items: state.cart.map(l=>({ name: l.name, qty: l.qty, lineTotal: l.lineTotal })),
    total: cartSubtotal(), notes, status: "Received"
  };
  await insertOrder(order);
  await bumpCustomerStamp(phone, name);
  state.cart = []; saveCartLocal();

  setTab('loyalty'); fireConfetti();

}
/* Optional card-payment path once Stripe (README Part 5) is set up. Safe
   to leave alone until then — it's just not linked from the main button. */
async function startStripeCheckout(){
  const name = document.getElementById("ckName").value.trim();
  const phone = document.getElementById("ckPhone").value.trim();
  if(!name || !phone){ showToast("Fill in your name and phone number 🙏"); return; }
  const notes = document.getElementById("ckNotes").value.trim();
  state.myProfile = { name, phone }; setLocal("moocha_my_profile", state.myProfile);

  const amount = cartSubtotal();
  const orderId = "M" + Date.now().toString().slice(-6);
  const items = state.cart.map(l=>({ name: l.name, qty: l.qty, lineTotal: l.lineTotal }));
  const base = window.location.origin + window.location.pathname;

  showToast("Taking you to payment…");
  try{
    const { data, error } = await sb.functions.invoke('create-checkout-session', {
      body: {
        orderId, name, phone, notes, items, amount,
        stallName: state.settings.stallName,
        successUrl: `${base}?stripe_success=1&order_id=${orderId}`,
        cancelUrl: `${base}?stripe_canceled=1`
      }
    });
    if(error || !data?.url){ console.error(error); showToast("Card payment isn't set up yet — use Place order instead"); return; }
    window.location.href = data.url;
  }catch(err){
    console.error(err);
    showToast("Card payment isn't set up yet — use Place order instead");
  }
}
/* Handles the redirect back from Stripe after checkout succeeds/cancels.
   The order itself is written by the stripe-webhook function once Stripe
   confirms the payment — not here — so a customer can't fake "I've paid". */
function handleStripeRedirect(){
  const params = new URLSearchParams(window.location.search);
  if(params.get('stripe_success')){
    state.cart = []; saveCartLocal();
    history.replaceState({}, '', window.location.pathname);
    refreshMyLoyalty().then(()=>setTab('loyalty'));
    fireConfetti();
    showToast("Payment received — see you soon! 🎉");
    return true;
  }
  if(params.get('stripe_canceled')){
    history.replaceState({}, '', window.location.pathname);
    showToast("Checkout canceled");
    return true;
  }
  return false;
}

/* ---------------- confetti ---------------- */
function fireConfetti(){
  const colors = ["#85A573","#FFE29A","#FF9E8B","#CDEFD1"];
  for(let i=0;i<26;i++){
    const p = document.createElement("div");
    p.className = "confetti-piece";
    const size = 6+Math.random()*6;
    p.style.width = size+"px"; p.style.height = size+"px";
    p.style.left = Math.random()*100+"vw";
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.transition = `transform ${1.2+Math.random()}s ease-in, opacity ${1.2+Math.random()}s ease-in`;
    document.body.appendChild(p);
    requestAnimationFrame(()=>{ p.style.transform = `translateY(${70+Math.random()*20}vh) rotate(${Math.random()*360}deg)`; p.style.opacity="0"; });
    setTimeout(()=>p.remove(), 2400);
  }
}

function renderSales(){
  const orders = state.orders;
  const revenue = orders.reduce((s,o)=>s+o.total,0);
  const avg = orders.length ? revenue/orders.length : 0;
  const itemCounts = {};
  orders.forEach(o=>o.items.forEach(i=>{ itemCounts[i.name] = (itemCounts[i.name]||0) + i.qty; }));
  const topItems = Object.entries(itemCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num">${money(revenue)}</div><div class="stat-label">Total revenue</div></div>
      <div class="stat-card"><div class="stat-num">${orders.length}</div><div class="stat-label">Orders</div></div>
      <div class="stat-card"><div class="stat-num">${money(avg)}</div><div class="stat-label">Avg order value</div></div>
      <div class="stat-card"><div class="stat-num">${new Set(orders.map(o=>o.phone)).size}</div><div class="stat-label">Unique customers</div></div>
    </div>
    <div class="chart-card"><canvas id="salesChart" height="160"></canvas></div>
    <div class="chart-card">
      <div style="font-family:'Baloo 2'; font-weight:700; margin-bottom:8px;">Top items</div>
      ${topItems.length ? topItems.map(([name,qty])=>`<div class="top-item-row"><span>${name}</span><span>${qty} sold</span></div>`).join("") : '<div style="font-size:13px; color:var(--brand);">No orders yet.</div>'}
    </div>
  `;
}
function drawSalesChart(){
  const canvas = document.getElementById("salesChart"); if(!canvas) return;
  const byDay = {};
  state.orders.forEach(o=>{ const day = o.date.slice(0,10); byDay[day] = (byDay[day]||0) + o.total; });
  const days = Object.keys(byDay).sort().slice(-7);
  const data = days.map(d=>byDay[d]);
  if(window._salesChartInstance) window._salesChartInstance.destroy();
  window._salesChartInstance = new Chart(canvas, {
    type: "bar",
    data: { labels: days.length?days:["No data"], datasets:[{ label:"Revenue ($)", data: data.length?data:[0], backgroundColor:"#85A573", borderRadius:8 }] },
    options: { plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true } } }
  });
}

}
function addSugarRow(){
  syncSugarRowsFromDOM();
  state.editingItem.sugarLevels.push("");
  document.getElementById('sugarRowsBox').innerHTML = renderSugarRows();
}
function removeSugarRow(i){
  syncSugarRowsFromDOM();
  state.editingItem.sugarLevels.splice(i,1);
  document.getElementById('sugarRowsBox').innerHTML = renderSugarRows();
}
function renderOptionRows(kind){
  const arr = kind==='milk' ? state.editingItem.milks : state.editingItem.toppings;
  if(arr.length===0) return `<div class="section-note" style="margin-bottom:8px;">None yet — this drink won't offer a ${kind==='milk'?'milk choice':'topping'} until you add one.</div>`;
  return arr.map((row,i)=>`
    <div style="display:flex; gap:8px; margin-bottom:8px; align-items:center;">
      <input id="${kind}Name_${i}" value="${row.name||''}" placeholder="Name" style="flex:2; border:2px solid var(--line); background:var(--paper); border-radius:12px; padding:9px 12px; font-weight:700; font-size:13.5px; color:var(--green-dark);">
      <input id="${kind}Price_${i}" type="number" step="0.10" value="${row.price||0}" placeholder="$" style="flex:1; border:2px solid var(--line); background:var(--paper); border-radius:12px; padding:9px 12px; font-weight:700; font-size:13.5px; color:var(--green-dark);">
      <button class="icon-btn danger" onclick="removeOptionRow('${kind}', ${i})">✕</button>
    </div>
  `).join("");
}
function syncOptionRowsFromDOM(kind){
  const arr = kind==='milk' ? state.editingItem.milks : state.editingItem.toppings;
  arr.forEach((row,i)=>{
    const nameEl = document.getElementById(`${kind}Name_${i}`);
    const priceEl = document.getElementById(`${kind}Price_${i}`);
    if(nameEl) row.name = nameEl.value;
    if(priceEl) row.price = parseFloat(priceEl.value) || 0;
  });
}
function addOptionRow(kind){
  syncOptionRowsFromDOM(kind);
  const arr = kind==='milk' ? state.editingItem.milks : state.editingItem.toppings;
  arr.push({ id: (kind==='milk'?'milk':'top')+Date.now(), name:"", price:0 });
  const boxId = kind==='milk' ? 'milkRowsBox' : 'toppingRowsBox';
  document.getElementById(boxId).innerHTML = renderOptionRows(kind);
}
function removeOptionRow(kind, i){
  syncOptionRowsFromDOM(kind);
  const arr = kind==='milk' ? state.editingItem.milks : state.editingItem.toppings;
  arr.splice(i,1);
  const boxId = kind==='milk' ? 'milkRowsBox' : 'toppingRowsBox';
  document.getElementById(boxId).innerHTML = renderOptionRows(kind);
}
function removePhoto(){ state.editingItem.photoUrl = null; renderEditorSheet(); }
async function handlePhotoFile(event){
  const file = event.target.files[0];
  if(!file) return;
  if(!file.type.startsWith("image/")){ showToast("Please choose a JPEG or PNG"); return; }
  if(file.size > 5*1024*1024){ showToast("Please choose an image under 5MB"); return; }

  if(sb){
    showToast("Uploading photo…");
    const ext = file.name.split('.').pop().toLowerCase();
    const path = `item-${Date.now()}.${ext}`;
    const { error } = await sb.storage.from('menu-photos').upload(path, file, { upsert: true });
    if(error){ console.error(error); showToast("Upload failed — try again"); return; }
    const { data } = sb.storage.from('menu-photos').getPublicUrl(path);
    state.editingItem.photoUrl = data.publicUrl;
    renderEditorSheet();
    showToast("Photo uploaded ✓");
  } else {
    const reader = new FileReader();
    reader.onload = () => { state.editingItem.photoUrl = reader.result; renderEditorSheet(); };
    reader.readAsDataURL(file);
  }
}
function closeEditor(){ document.getElementById("editorOverlay").classList.remove("show"); }
async function saveItem(){
  syncOptionRowsFromDOM('milk');
  syncOptionRowsFromDOM('topping');
  syncSugarRowsFromDOM();
  const name = document.getElementById("edName").value.trim();
  const desc = document.getElementById("edDesc").value.trim();
  const price = parseFloat(document.getElementById("edPrice").value) || 0;
  const cat = document.getElementById("edCat").value.trim();
  const iced = document.getElementById("edIced").checked;
  if(!name || !cat){ showToast("Name and category are required"); return; }
  const { cat: oldCat, item: oldItem, milks, toppings, sugarLevels, photoUrl } = state.editingItem;
  const cleanMilks = milks.filter(m=>m.name.trim()).map(m=>({ id:m.id, name:m.name.trim(), price:m.price||0 }));
  const cleanToppings = toppings.filter(t=>t.name.trim()).map(t=>({ id:t.id, name:t.name.trim(), price:t.price||0 }));
  const cleanSugarLevels = sugarLevels.map(s=>s.trim()).filter(Boolean);
  if(oldItem){ state.menu.categories[oldCat] = state.menu.categories[oldCat].filter(i=>i.id!==oldItem.id); }
  if(!state.menu.categories[cat]) state.menu.categories[cat] = [];
  const newItem = { id: oldItem?oldItem.id:("i"+Date.now()), name, desc, price, iced, soldout: oldItem?oldItem.soldout:false, milks:cleanMilks, toppings:cleanToppings, sugarLevels:cleanSugarLevels };
  if(photoUrl) newItem.photo = photoUrl; else newItem.icon = "matcha";
  state.menu.categories[cat].push(newItem);
  await persistMenu();
  closeEditor();
}

function renderSettings(){
  const s = state.settings;
  return `
    <div class="settings-row">
      <div><div class="admin-item-name">Accepting orders</div><div class="sub" style="font-size:12px;color:var(--brand);">Turn off to pause the customer app</div></div>
      <div class="toggle ${s.paymentEnabled?'on':''}" onclick="togglePayment()"><div class="knob"></div></div>
    </div>
    <div class="field"><label>PayNow number</label><input id="stPhone" value="${s.stallPhone}"></div>
    <div class="field"><label>Stall name (shown on QR)</label><input id="stName" value="${s.stallName}"></div>
    <button class="btn-primary" onclick="saveSettings()"><span>Save settings</span><span>→</span></button>
    ${!sb ? `<div class="demo-banner" style="margin-top:14px;">Connect Supabase (see README.md) to make this real across every device.</div>` : ""}

    <div class="section-label" style="margin-top:26px;">Staff passphrase</div>
    <div class="section-note">Used to unlock this dashboard from the gear icon.</div>
    <div class="field"><label>Current passphrase</label><input id="ppOld" type="password"></div>
    <div class="field"><label>New passphrase</label><input id="ppNew" type="password"></div>
    <button class="btn-secondary" onclick="submitChangePassphrase()">Change passphrase</button>
  `;
}
async function togglePayment(){ state.settings.paymentEnabled = !state.settings.paymentEnabled; await persistSettings(); setATab("settings"); }
async function saveSettings(){
  state.settings.stallPhone = document.getElementById("stPhone").value.trim();
  state.settings.stallName = document.getElementById("stName").value.trim();
  await persistSettings();
  showToast("Settings saved");
}
async function submitChangePassphrase(){
  const oldPass = document.getElementById("ppOld").value;
  const newPass = document.getElementById("ppNew").value;
  if(!oldPass || !newPass){ showToast("Fill in both fields"); return; }
  if(newPass.length < 6){ showToast("Use at least 6 characters"); return; }
  const ok = await changeStaffPassphrase(oldPass, newPass);
  if(ok) showToast("Passphrase changed ✓");
  else showToast("Current passphrase was wrong");
}

/* ---------------- init ---------------- */
(async function init(){
  await loadShared();
  const handledRedirect = handleStripeRedirect();
  if(!handledRedirect) setTab("menu");
  setInterval(async ()=>{
    if(!state.isAdmin){
      state.settings = await fetchSettings();
      state.menu = await fetchMenu();
      if(state.tab==="menu" || state.tab==="cart") render();
    }
  }, 8000);
})();
</script>
</body>
